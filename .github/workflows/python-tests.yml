name: Selenium Tests - SauceDemo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Instalar geckodriver (si no existe)
      run: |
        if ! command -v geckodriver &>/dev/null; then
          GECKO_VERSION=$(curl -s https://api.github.com/repos/mozilla/geckodriver/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          wget -q "https://github.com/mozilla/geckodriver/releases/download/${GECKO_VERSION}/geckodriver-${GECKO_VERSION}-linux64.tar.gz" -O /tmp/geckodriver.tar.gz
          tar -xzf /tmp/geckodriver.tar.gz -C /tmp
          sudo mv /tmp/geckodriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/geckodriver
        fi
        geckodriver --version | head -2

    - name: Ejecutar pruebas
      run: |
        HEADLESS=true python -m pytest test_tienda.py --html=reports/reporte_pruebas.html --self-contained-html -v

    - name: Subir reporte HTML como artifact
      uses: actions/upload-artifact@v4
      with:
        name: reporte-pruebas-selenium
        path: reports/reporte_pruebas.html
