name: Selenium Tests - SauceDemo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Instalar Firefox y geckodriver
      run: |
        sudo apt-get update
        sudo apt-get install -y firefox geckodriver

    - name: Ejecutar pruebas
      run: |
        HEADLESS=true python -m pytest test_tienda.py --html=reports/reporte_pruebas.html --self-contained-html -v

    - name: Subir reporte HTML como artifact
      uses: actions/upload-artifact@v4
      with:
        name: reporte-pruebas-selenium
        path: reports/reporte_pruebas.html
